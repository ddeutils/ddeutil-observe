{% extends "shared/layout.html" %}
{% block main_content %}
<section class="content">
    <!-- Content Header -->
    <header class="content-header">
        <h1>Schedule</h1>
    </header>
    <!-- Content Section -->
    <article class="content-article" id="schedule-content-article">

        <header class="content-article-header">
            <h2>Schedule Logs</h2>
            <div class="search-container">
                <i class="bx bx-search"></i>
                <input class="form-control"
                       type="text"
                       name="search_text"
                       placeholder="Running ID"
                       value="{{ search_text }}"
                       hx-get="/schedule/search/"
                       hx-trigger="keyup changed delay:750ms"
                       hx-target="#schedule-results"
                       hx-push-url="true"
                       hx-indicator=".htmx-indicator">
                <span class="htmx-indicator"><img src="/static/img/bars.svg" alt="progress bars" /></span>
            </div>
        </header>

        <div class="content-article-body">
            <div class="content-article-table">
                {% include 'schedule/partials/schedule-row.html' %}
            </div>
            <div class="content-article-detail" id="schedule-content-article-detail">
                <span class="htmx-indicator">
                    <img src="/static/img/bars.svg" alt="progress bars" />
                </span>
            </div>
        </div>
    </article>
</section>
{% endblock %}
{% block additional_css %}
<link rel="stylesheet" href="/static/css/workflow-content.css"/>
{% endblock %}
