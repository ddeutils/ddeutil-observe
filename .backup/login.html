<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.6/htmx.min.js"></script>
  <style>
    :root {
      /* Light theme variables */
      --bg-color: rgba(255, 255, 255, 1);
      --text-color: rgba(37, 37, 37, 1);
      --border-color: rgba(220, 220, 220, 1);
      --input-bg: rgba(250, 250, 250, 1);
      --input-focus-border: rgba(55, 53, 47, 0.3);
      --button-bg: rgba(55, 53, 47, 1);
      --button-hover-bg: rgba(55, 53, 47, 0.85);
      --button-text: rgba(255, 255, 255, 1);
      --link-color: rgba(55, 53, 47, 0.65);
      --link-hover-color: rgba(55, 53, 47, 1);
      --shadow-color: rgba(15, 15, 15, 0.05);
    }

    [data-theme="dark"] {
      /* Dark theme variables */
      --bg-color: rgba(25, 25, 25, 1);
      --text-color: rgba(235, 235, 235, 1);
      --border-color: rgba(60, 60, 60, 1);
      --input-bg: rgba(40, 40, 40, 1);
      --input-focus-border: rgba(200, 200, 200, 0.4);
      --button-bg: rgba(235, 235, 235, 1);
      --button-hover-bg: rgba(235, 235, 235, 0.85);
      --button-text: rgba(25, 25, 25, 1);
      --link-color: rgba(200, 200, 200, 0.7);
      --link-hover-color: rgba(235, 235, 235, 1);
      --shadow-color: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 24px var(--shadow-color);
      background-color: var(--bg-color);

      & h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
      }

      & form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;

      & label {
        font-size: 0.875rem;
        font-weight: 500;
      }

      & input {
        height: 2.5rem;
        padding: 0 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background-color: var(--input-bg);
        color: var(--text-color);
        font-size: 0.9375rem;
        outline: none;

        &:focus {
          border-color: var(--input-focus-border);
          box-shadow: 0 0 0 1px var(--input-focus-border);
        }
      }
    }

    .button {
      height: 2.5rem;
      border: none;
      border-radius: 4px;
      background-color: var(--button-bg);
      color: var(--button-text);
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;

      &:hover {
        background-color: var(--button-hover-bg);
      }

      &.loading {
        opacity: 0.7;
        cursor: not-allowed;
      }
    }

    .form-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;

      & .form-switch {
        color: var(--link-color);
        text-decoration: none;
        cursor: pointer;

        &:hover {
          color: var(--link-hover-color);
          text-decoration: underline;
        }
      }
    }

    .theme-toggle {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--button-bg);
      color: var(--button-text);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px var(--shadow-color);

      & svg {
        width: 1.25rem;
        height: 1.25rem;
        fill: currentColor;
      }
    }

    /* Animation for form switching */
    .htmx-swapping {
      opacity: 0;
      transform: translateY(10px);
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem;
        box-shadow: none;
      }

      body {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="container" id="auth-container">
    <!-- Login Form -->
    <h1>Log in</h1>
    <form hx-post="/api/login" hx-trigger="submit" hx-indicator=".button">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="button">
        Log in
      </button>
    </form>
    <div class="form-footer">
      <span>Don't have an account? </span>
      <a class="form-switch"
         hx-get="/api/auth/register-form"
         hx-target="#auth-container"
         hx-swap="innerHTML transition:true">Register</a>
    </div>
  </div>

  <!-- Register Form (hidden initially, shown via HTMX) -->
  <div id="register-template" style="display: none;">
    <h1>Create account</h1>
    <form hx-post="/api/register" hx-trigger="submit" hx-indicator=".button">
      <div class="input-group">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" name="username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="input-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" name="password" required autocomplete="new-password">
      </div>
      <button type="submit" class="button">
        Create account
      </button>
    </form>
    <div class="form-footer">
      <span>Already have an account? </span>
      <a class="form-switch"
         hx-get="/api/auth/login-form"
         hx-target="#auth-container"
         hx-swap="innerHTML transition:true">Log in</a>
    </div>
  </div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="theme-icon">
      <path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z" />
    </svg>
  </button>

  <script>
    // Theme Toggle Functionality
    document.getElementById('theme-toggle').addEventListener('click', function() {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    // Check for saved theme preference
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
      }
    });

    // HTMX endpoint simulations (for demonstration)
    htmx.on('htmx:afterRequest', function(event) {
      if (event.detail.pathInfo.requestPath === '/api/auth/register-form') {
        event.detail.xhr.response = document.getElementById('register-template').innerHTML;
      }
      if (event.detail.pathInfo.requestPath === '/api/auth/login-form') {
        // Just reload the page for simplicity in this demo
        window.location.reload();
      }
    });
  </script>
</body>
</html>
